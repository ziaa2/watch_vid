<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Airdrop Radar</title>
<meta name="theme-color" content="#0e1b21">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1b21;--sf:#152a33;--sf2:#1c3944;--tx:#e8f1ef;--mu:#8fa9ac;--ac:#f2b84b;--acx:#1a1300;--dg:#ff7b66;--ok:#5fd0a0;--ln:#264652;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f6f4;--sf:#fff;--sf2:#e6eeeb;--tx:#12262d;--mu:#5b7378;--ac:#b9770b;--acx:#fff;--dg:#c8442f;--ok:#1f8a5f;--ln:#d2dedb}}
:root[data-theme="dark"]{--bg:#0e1b21;--sf:#152a33;--sf2:#1c3944;--tx:#e8f1ef;--mu:#8fa9ac;--ac:#f2b84b;--acx:#1a1300;--dg:#ff7b66;--ok:#5fd0a0;--ln:#264652}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 150px}
h1{font-size:30px;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:15px;font-weight:600;color:var(--mu);margin:26px 0 8px}
.sub{color:var(--mu);margin:0 0 6px}
.row{display:flex;align-items:center;gap:10px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--ln)}
.task:last-child{border-bottom:0}
.task .t{flex:1;min-width:0}
.task small,.mu{color:var(--mu);font-size:13px}
.done .t b{text-decoration:line-through;color:var(--mu)}
.cb{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--mu);background:none;color:var(--acx);font:700 14px/1 inherit;cursor:pointer;padding:0}
.cb.on{background:var(--ok);border-color:var(--ok)}
.chip{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--sf2);color:var(--mu);margin-right:4px}
.chip.hot{background:var(--dg);color:#1a0500;font-weight:600}
.chip.rc{background:var(--ac);color:var(--acx)}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--sf2);cursor:pointer}
.btn.pri{background:var(--ac);color:var(--acx);font-weight:600}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.dg{color:var(--dg)}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:170px;resize:vertical}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{height:6px;border-radius:9px;background:var(--sf2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:640px}
nav button{flex:1;background:none;border:0;padding:14px 4px;color:var(--mu);cursor:pointer;font-weight:600}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 18px rgba(0,0,0,.35);padding:12px 18px;border-radius:99px}
.sheet{position:fixed;inset:0;background:rgba(3,10,12,.7);display:none;z-index:9;overflow-y:auto}
.sheet.open{display:block}
.sheet>div{max-width:640px;margin:0 auto;background:var(--bg);min-height:100%;padding:20px 16px 40px}
.lbl{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.warn{border-left:4px solid var(--ac);background:var(--sf2);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;display:none;z-index:10}
a{color:var(--ac);word-break:break-all}
.empty{text-align:center;color:var(--mu);padding:36px 10px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--ln);padding:12px 18px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:12px}
.ping{position:relative;width:10px;height:10px;border-radius:50%;background:var(--ac)}
.ping::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--ac);animation:pg 2.6s ease-out infinite}
@keyframes pg{from{transform:scale(1);opacity:.9}to{transform:scale(3.4);opacity:0}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
main{animation:fi .2s ease-out;padding-bottom:170px}
h1{font-size:32px}
.card{border-radius:18px;padding:14px 16px;transition:transform .15s,border-color .2s}
.card:active{transform:scale(.99)}
.btn{transition:transform .12s,filter .15s,background .2s;min-height:40px}
.btn.sm{min-height:32px}
.btn:hover{filter:brightness(1.1)}
.btn:active,.fab:active{transform:scale(.96)}
.cb{position:relative;transition:background .18s,border-color .18s,transform .12s}
.cb::before{content:"";position:absolute;inset:-9px}
.cb:active{transform:scale(.88)}
.task{padding:12px 4px}
input,select,textarea{transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent);outline:0}
.bar{height:7px}.bar i{transition:width .4s cubic-bezier(.2,.8,.2,1)}
.sheet{display:block;opacity:0;visibility:hidden;transition:opacity .22s,visibility 0s .22s;backdrop-filter:blur(3px)}
.sheet.open{opacity:1;visibility:visible;transition-delay:0s}
.sheet>div{margin-top:36px;min-height:calc(100% - 36px);border-radius:24px 24px 0 0;border:1px solid var(--ln);transform:translateY(28px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.open>div{transform:none}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:4px;border:1px solid var(--ln);border-radius:22px;background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(0,0,0,.28)}
nav div{gap:4px}
nav button{padding:11px 4px;border-radius:16px;transition:background .2s,color .2s}
nav button.on{box-shadow:none;background:var(--sf2)}
.fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#toast{bottom:calc(150px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 18px rgba(0,0,0,.3)}
.empty{padding:48px 12px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<header class="top"><span class="ping"></span>Airdrop Radar</header>
<main id="app"></main>
<button class="btn pri fab" data-act="add">+ Tambah cepat</button>
<nav><div id="nav"></div></nav>
<div class="sheet" id="sheet"><div id="sheetIn"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>d.toLocaleDateString('sv');
const today=()=>iso(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const STAT={aktif:'Aktif',menunggu:'Menunggu',klaim:'Sudah klaim',dropped:'Dropped'};
const RC={none:'Sekali',daily:'Harian',weekly:'Mingguan'};
let tab='today',q='',kf='',P=null,OPEN=new Set();

function seed(){return{airdrops:[
{id:'a1',name:'Orbit Finance',status:'aktif',deadline:addDays(2),tasks:[
{id:'t1',text:'Follow Twitter/X',done:false,recur:'none'},
{id:'t2',text:'Daily check-in',recur:'daily',last:null},
{id:'t3',text:'Bridge di testnet',done:false,recur:'none'}],
links:[{url:'https://x.com/orbitfi',kind:'Twitter/X',tid:'t1'},{url:'https://app.orbit.example/checkin',kind:'Website',tid:'t2'}]},
{id:'a2',name:'Kite Layer',status:'aktif',deadline:addDays(12),tasks:[
{id:'t4',text:'Join Discord',done:false,recur:'none'},
{id:'t5',text:'Quest mingguan',recur:'weekly',last:null}],
links:[{url:'https://discord.gg/kitelayer',kind:'Discord',tid:'t4'}]}],
wallets:[{id:'w1',label:'Wallet utama',chain:'EVM',addr:'0xa11ce0000000000000000000000000000000beef'},
{id:'w2',label:'Wallet farming 1',chain:'Solana',addr:'So1DummyAddressUntukContohSajaXXXXXXXXXXXXXX'}]}}
let S=(()=>{try{const r=localStorage.getItem('ar-proto1');if(r)return JSON.parse(r)}catch(e){}return seed()})();
const save=()=>{try{localStorage.setItem('ar-proto1',JSON.stringify(S))}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1800)};

const isDone=t=>t.recur==='none'?!!t.done:t.recur==='daily'?t.last===today():!!t.last&&(Date.now()-new Date(t.last))/864e5<7;
const flip=t=>{if(t.recur==='none')t.done=!t.done;else t.last=isDone(t)?null:today()};
const left=a=>a.deadline?Math.ceil((new Date(a.deadline+'T23:59:00')-new Date())/864e5):null;
const dchip=a=>{const d=left(a);if(d===null)return'';return d<0?'<span class="chip hot">Lewat</span>':d===0?'<span class="chip hot">Hari ini</span>':`<span class="chip ${d<=3?'hot':''}">Sisa ${d} hari</span>`};

/* ---------- parser ---------- */
const URLRE=/(?:https?:\/\/|(?:x|twitter)\.com\/|t\.me\/|discord\.gg\/)[^\s)>\]"]+/gi;
const KW=/\b(join|follow|retweet|repost|like|quote|claim|swap|bridge|stake|mint|deposit|faucet|testnet|check-?in|quest|connect|register|verify|submit|comment|invite|refer|ikut|gabung|klaim|daftar)\b/i;
const MON={jan:0,feb:1,mar:2,apr:3,mei:4,may:4,jun:5,jul:6,agu:7,aug:7,sep:8,okt:9,oct:9,nov:10,des:11,dec:11};
const MR='jan|feb|mar|apr|mei|may|jun|jul|agu|aug|sep|okt|oct|nov|des|dec';
const kindOf=u=>/x\.com|twitter\.com/i.test(u)?'Twitter/X':/t\.me/i.test(u)?'Telegram':/discord/i.test(u)?'Discord':/galxe|zealy|layer3|questn|taskon/i.test(u)?'Quest':'Website';
function mk(d,mo,y){const n=new Date();let dt=new Date(y||n.getFullYear(),mo,d);if(!y&&dt<n-30*864e5)dt.setFullYear(dt.getFullYear()+1);return iso(dt)}
function parseDate(s){
 let m=s.match(new RegExp('(\\d{1,2})\\s*('+MR+')[a-z]*\\.?,?\\s*(\\d{4})?','i'));
 if(m)return mk(+m[1],MON[m[2].toLowerCase()],m[3]&&+m[3]);
 m=s.match(new RegExp('('+MR+')[a-z]*\\.?\\s*(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s*(\\d{4}))?','i'));
 if(m)return mk(+m[2],MON[m[1].toLowerCase()],m[3]&&+m[3]);
 m=s.match(/(\d+)\s*(?:days?|hari)/i);
 return m?addDays(+m[1]):null}
function parse(text){
 const lines=text.split(/\n+/).map(l=>l.trim()).filter(Boolean);
 const DL=/deadline|until|sampai|batas|berakhir|\bends?\b|selesai/i;
 let deadline=null;
 for(const l of lines){if(DL.test(l)){const d=parseDate(l);if(d){deadline=d;break}}}
 const tasks=[],links=[],seen=new Set();
 const addLink=(u,ti)=>{if(!/^https?:/i.test(u))u='https://'+u;u=u.replace(/[.,]+$/,'');if(seen.has(u))return u;seen.add(u);links.push({url:u,kind:kindOf(u),ti});return u};
 lines.forEach((l,i)=>{
  const urls=l.match(URLRE)||[];
  let clean=l.replace(URLRE,'').replace(/[^\p{L}\p{N}\s.,:'&+\-\/()]/gu,' ').replace(/^[\d.\-\s:]+/,'').replace(/\s+/g,' ').trim();
  const isDl=DL.test(l)&&parseDate(l);
  if(KW.test(clean)&&!isDl&&clean.length>2){
   let u=urls[0];
   if(!u&&lines[i+1]&&lines[i+1].replace(URLRE,'').trim()===''&&(lines[i+1].match(URLRE)||[])[0])u=lines[i+1].match(URLRE)[0];
   const ti=tasks.length;
   let text=clean.replace(/[:\-]\s*$/,'');
   if(u&&text.split(' ').length<=2)text+=' ('+kindOf(u)+')';
   tasks.push({text,inc:true,recur:/daily|setiap hari|tiap hari|harian/i.test(l)?'daily':/weekly|mingguan|tiap minggu/i.test(l)?'weekly':'none'});
   if(u)addLink(u,ti)}
  urls.forEach(u=>addLink(u,null))});
 let first=(lines[0]||'').replace(URLRE,'').replace(/[^\p{L}\p{N}\s.:'&+\-]/gu,' ').replace(/\s+/g,' ').trim();
 const nm=first.match(/(?:airdrop|project)\s*[:\-]?\s*(.+?)(?:\(|$)/i);
 return{name:(nm?nm[1]:first).trim().slice(0,40)||'Airdrop baru',deadline,tasks,links}}

/* ---------- views ---------- */
function taskRow(a,t,showProj){const on=isDone(t);
 return `<div class="task ${on?'done':''}"><button class="cb ${on?'on':''}" data-act="tog" data-a="${a.id}" data-t="${t.id}" aria-label="Tandai selesai">${on?'✓':''}</button>
 <div class="t"><b>${esc(t.text)}</b><br><small>${showProj?esc(a.name)+' ':''}${t.recur!=='none'?`<span class="chip rc">${RC[t.recur]}</span>`:''}${dchip(a)}</small></div></div>`}
function vToday(){
 const act=S.airdrops.filter(a=>a.status==='aktif');
 const near=act.filter(a=>{const d=left(a);return d!==null&&d<=3});
 const rec=[],once=[];
 act.forEach(a=>a.tasks.forEach(t=>(t.recur!=='none'?rec:once).push([a,t])));
 const todo=rec.filter(([a,t])=>!isDone(t)).length+once.filter(([a,t])=>!isDone(t)).length;
 const dt=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
 let h=`<h1>Hari ini</h1><p class="sub">${dt} · ${todo} task belum selesai</p>`;
 if(near.length)h+=`<h2>Deadline dekat</h2>`+near.sort((x,y)=>left(x)-left(y)).map(a=>`<div class="card row"><div style="flex:1"><b>${esc(a.name)}</b><br><small class="mu">${a.tasks.filter(t=>!isDone(t)).length} task belum selesai</small></div>${dchip(a)}</div>`).join('');
 if(rec.length)h+=`<h2>Rutin</h2><div class="card">`+rec.map(([a,t])=>taskRow(a,t,1)).join('')+`</div>`;
 if(once.length)h+=`<h2>Task lainnya</h2><div class="card">`+once.sort((x,y)=>(x[0].deadline||'9').localeCompare(y[0].deadline||'9')).map(([a,t])=>taskRow(a,t,1)).join('')+`</div>`;
 if(!act.length)h+=`<div class="empty">Belum ada garapan aktif.<br>Tekan “Tambah cepat” lalu paste pesan dari grup.</div>`;
 return h}
function vAir(){
 let h=`<h1>Airdrop</h1><p class="sub">${S.airdrops.length} project</p>`;
 if(!S.airdrops.length)return h+`<div class="empty">Belum ada airdrop. Tekan “Tambah cepat”.</div>`;
 return h+S.airdrops.map(a=>{const n=a.tasks.length,d=a.tasks.filter(isDone).length;
  return `<details class="card" data-id="${a.id}" ${OPEN.has(a.id)?'open':''}><summary><div class="row"><b style="flex:1">${esc(a.name)}</b>${dchip(a)}<span class="chip">${STAT[a.status]}</span></div>
  <div class="bar"><i style="width:${n?d/n*100:0}%"></i></div><small class="mu">${d}/${n} selesai</small></summary>
  <div style="margin-top:8px">${a.tasks.map(t=>{const l=a.links.find(l=>l.tid===t.id);return taskRow(a,t,0).replace('</small></div></div>',`</small>${l?`<br><a href="${esc(l.url)}" target="_blank" rel="noopener"><small>${esc(l.kind)}: ${esc(l.url.replace(/^https?:\/\//,'').slice(0,40))}</small></a>`:''}</div></div>`)}).join('')}
  <div class="row" style="margin-top:10px"><select data-act="stat" data-a="${a.id}" style="flex:1">${Object.entries(STAT).map(([k,v])=>`<option value="${k}" ${a.status===k?'selected':''}>${v}</option>`).join('')}</select><button class="btn sm dg" data-act="del" data-a="${a.id}">Hapus</button></div></div></details>`}).join('')}
function vLinks(){
 const all=S.airdrops.flatMap(a=>a.links.map(l=>({...l,a,t:a.tasks.find(t=>t.id===l.tid)})));
 const kinds=[...new Set(all.map(l=>l.kind))];
 const f=all.filter(l=>(!kf||l.kind===kf)&&(!q||(l.url+l.a.name).toLowerCase().includes(q.toLowerCase())));
 let h=`<h1>Link</h1><p class="sub">${all.length} link terkumpul</p><input id="q" placeholder="Cari link atau project" value="${esc(q)}"><div style="margin:10px 0">`+
 [['','Semua'],...kinds.map(k=>[k,k])].map(([k,v])=>`<button class="btn sm ${kf===k?'pri':''}" data-act="kf" data-k="${esc(k)}" style="margin:0 4px 6px 0">${esc(v)}</button>`).join('')+'</div>';
 return h+(f.length?f.map(l=>`<div class="card"><div class="row"><span class="chip">${l.kind}</span><small class="mu" style="flex:1">${esc(l.a.name)}${l.t?' · '+esc(l.t.text):''}</small><button class="btn sm" data-act="cp" data-v="${esc(l.url)}">Salin</button></div><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a></div>`).join(''):'<div class="empty">Tidak ada link yang cocok.</div>')}
function vWallet(){
 return `<h1>Wallet</h1><p class="sub">Alamat publik saja, sekali tap untuk salin</p>
 <div class="warn">Jangan simpan seed phrase atau private key di sini. Kolom yang berisi kata pemulihan atau kunci privat akan ditolak.</div>`+
 S.wallets.map(w=>`<div class="card"><div class="row"><b style="flex:1">${esc(w.label)}</b><span class="chip">${esc(w.chain)}</span></div><div class="row" style="margin-top:4px"><small class="mu" style="flex:1;word-break:break-all">${esc(w.addr)}</small><button class="btn sm" data-act="cp" data-v="${esc(w.addr)}">Salin</button><button class="btn sm dg" data-act="dw" data-w="${w.id}">Hapus</button></div></div>`).join('')+
 `<h2>Tambah wallet</h2><div class="card"><input id="wl" placeholder="Label, mis. Wallet farming 2"><label class="lbl">Chain</label><select id="wc"><option>EVM</option><option>Solana</option><option>Sui</option><option>Aptos</option><option>Lainnya</option></select><label class="lbl">Alamat publik</label><input id="wa" placeholder="0x… / alamat Solana"><p><button class="btn pri" data-act="aw">Simpan wallet</button></p></div>
 <h2>Cadangan</h2><button class="btn" data-act="exp">Salin cadangan data (JSON)</button>`}
function render(){
 $('#app').innerHTML={today:vToday,air:vAir,links:vLinks,wallet:vWallet}[tab]();
 $('#nav').innerHTML=[['today','Hari ini'],['air','Airdrop'],['links','Link'],['wallet','Wallet']].map(([k,v])=>`<button class="${tab===k?'on':''}" data-act="tab" data-k="${k}">${v}</button>`).join('')}

/* ---------- quick add ---------- */
const SAMPLE=`🔥 NEW AIRDROP: Nebula Protocol (testnet)
✅ Join Discord https://discord.gg/nebula
✅ Follow https://x.com/nebulaprotocol dan retweet pinned
✅ Daily check-in di https://app.nebula.xyz/quest
✅ Swap minimal 3x di testnet
Deadline: 12 Oct 2026
Claim: https://claim.nebula.xyz`;
function sheet(html){$('#sheetIn').innerHTML=html;$('#sheet').classList.add('open')}
const closeSheet=()=>{$('#sheet').classList.remove('open');P=null};
function openAdd(){sheet(`<div class="row"><h1 style="flex:1">Tambah cepat</h1><button class="btn sm" data-act="close">Tutup</button></div>
 <p class="sub">Paste pesan dari grup Telegram. Link, task, dan deadline dipilah otomatis.</p>
 <textarea id="raw" placeholder="Paste pesan di sini"></textarea>
 <p class="row"><button class="btn pri" data-act="parse">Deteksi</button><button class="btn" data-act="sample">Pakai contoh pesan</button></p>`)}
function openPrev(){
 sheet(`<div class="row"><h1 style="flex:1">Cek hasil deteksi</h1><button class="btn sm" data-act="close">Tutup</button></div>
 <label class="lbl">Nama project</label><input data-p="name" value="${esc(P.name)}">
 <label class="lbl">Deadline ${P.deadline?'(terdeteksi)':'(tidak terdeteksi)'}</label><input type="date" data-p="deadline" value="${P.deadline||''}">
 <h2>Task (${P.tasks.length})</h2>`+
 (P.tasks.length?P.tasks.map((t,i)=>{const l=P.links.find(l=>l.ti===i);return `<div class="card"><div class="task ${t.inc?'':'done'}" style="border:0;padding:0"><button class="cb ${t.inc?'on':''}" data-act="pinc" data-i="${i}">${t.inc?'✓':''}</button><div class="t"><input data-p="ttext" data-i="${i}" value="${esc(t.text)}">
 <div class="row" style="margin-top:6px"><select data-p="trec" data-i="${i}" style="width:auto">${Object.entries(RC).map(([k,v])=>`<option value="${k}" ${t.recur===k?'selected':''}>${v}</option>`).join('')}</select>${l?`<small class="mu">${l.kind}</small>`:''}</div>${l?`<small><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a></small>`:''}</div></div></div>`}).join(''):'<div class="empty">Tidak ada task terdeteksi. Task bisa ditambah manual setelah disimpan.</div>')+
 `<h2>Link lain (${P.links.filter(l=>l.ti===null).length})</h2>`+P.links.filter(l=>l.ti===null).map(l=>`<div class="card"><span class="chip">${l.kind}</span> <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a></div>`).join('')+
 `<p style="margin-top:20px"><button class="btn pri" data-act="commit">Simpan airdrop</button></p>`)}
function commit(){
 const idx=[],tasks=[];
 P.tasks.forEach((t,i)=>{if(t.inc){const id=uid();idx[i]=id;tasks.push({id,text:t.text,recur:t.recur,done:false,last:null})}});
 const links=P.links.map(l=>({url:l.url,kind:l.kind,tid:l.ti!==null?idx[l.ti]||null:null}));
 const a={id:uid(),name:P.name||'Airdrop baru',status:'aktif',deadline:P.deadline||null,tasks,links};
 S.airdrops.unshift(a);save();closeSheet();tab='today';render();toast('Airdrop tersimpan')}

/* ---------- events ---------- */
const validWallet=v=>{const s=v.trim();if(s.split(/\s+/).length>=12)return'Ini terlihat seperti seed phrase. Tidak disimpan.';if(/^(0x)?[0-9a-f]{64}$/i.test(s))return'Ini terlihat seperti private key. Tidak disimpan.';return s.length<20?'Alamat terlalu pendek.':''};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const d=b.dataset,act=d.act;
 const A=id=>S.airdrops.find(a=>a.id===id);
 if(act==='tab'){tab=d.k;const m=$('#app');m.style.animation='none';void m.offsetWidth;m.style.animation='';render();scrollTo(0,0)}
 else if(act==='add')openAdd();
 else if(act==='close')closeSheet();
 else if(act==='sample')$('#raw').value=SAMPLE;
 else if(act==='parse'){const v=$('#raw').value.trim();if(!v)return toast('Paste pesan dulu');P=parse(v);openPrev()}
 else if(act==='pinc'){P.tasks[+d.i].inc=!P.tasks[+d.i].inc;openPrev()}
 else if(act==='commit')commit();
 else if(act==='tog'){const a=A(d.a);flip(a.tasks.find(t=>t.id===d.t));save();render()}
 else if(act==='del'){if(confirm('Hapus airdrop ini?')){S.airdrops=S.airdrops.filter(a=>a.id!==d.a);save();render()}}
 else if(act==='kf'){kf=d.k;render()}
 else if(act==='cp'){(navigator.clipboard?navigator.clipboard.writeText(d.v):Promise.reject()).then(()=>toast('Disalin'),()=>toast('Gagal menyalin'))}
 else if(act==='dw'){S.wallets=S.wallets.filter(w=>w.id!==d.w);save();render()}
 else if(act==='aw'){const l=$('#wl').value.trim(),a=$('#wa').value.trim();if(!l||!a)return toast('Isi label dan alamat');const er=validWallet(a);if(er)return toast(er);S.wallets.push({id:uid(),label:l,chain:$('#wc').value,addr:a});save();render();toast('Wallet tersimpan')}
 else if(act==='exp'){(navigator.clipboard?navigator.clipboard.writeText(JSON.stringify(S)):Promise.reject()).then(()=>toast('Cadangan disalin'),()=>toast('Gagal menyalin'))}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){q=t.value;const p=t.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p);return}
 const k=t.dataset.p;if(!k||!P)return;const i=+t.dataset.i;
 if(k==='name')P.name=t.value;else if(k==='deadline')P.deadline=t.value||null;else if(k==='ttext')P.tasks[i].text=t.value;else if(k==='trec')P.tasks[i].recur=t.value});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.act==='stat'){S.airdrops.find(a=>a.id===t.dataset.a).status=t.value;save();render()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.tagName==='DETAILS'&&d.dataset.id){d.open?OPEN.add(d.dataset.id):OPEN.delete(d.dataset.id)}},true);
document.addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
if('serviceWorker' in navigator)addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}});
render();
</script></body></html>
